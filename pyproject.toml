[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zapret-console"
version = "0.2.0"
description = "A Russian terminal interface for managing zapret on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Zapret Console contributors"}]
classifiers = ["Operating System :: POSIX :: Linux", "Environment :: Console", "Programming Language :: Python :: 3"]

[project.scripts]
zapret-console = "zapret_console.app:entrypoint"

[project.optional-dependencies]
gui = ["PySide6==6.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zapret_console.gui" = ["qml/*.qml", "qml/qmldir"]
