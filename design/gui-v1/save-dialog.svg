<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720"><style>text{font-family:"DejaVu Sans",sans-serif}</style><rect x="0" y="0" width="1040" height="720" rx="0" fill="#0d1318" stroke="none"/><rect x="0" y="0" width="208" height="720" rx="0" fill="#10191f" stroke="none"/><path d="M208 0L208 720" stroke="#293943"/><rect x="24" y="29" width="36" height="36" rx="10" fill="#73e2c2" stroke="none"/><path d="M34 40h15L34 55h15" stroke="#0d1318" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="73" y="44" fill="#ecf2f5" font-size="19" font-weight="700">Zapret</text><text x="74" y="62" fill="#a1b1ba" font-size="11" font-weight="400">Console</text><text x="28" y="115" fill="#a1b1ba" font-size="10" font-weight="600">УПРАВЛЕНИЕ</text><g transform="translate(31 144) scale(0.8333333333333334)"><path d="M3 10L12 3l9 7v10h-6v-6H9v6H3z" fill="none" stroke="#a1b1ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="160" fill="#a1b1ba" font-size="14" font-weight="400">Главная</text><rect x="16" y="184" width="176" height="44" rx="10" fill="#213731" stroke="none"/><rect x="16" y="196" width="3" height="20" rx="1" fill="#73e2c2" stroke="none"/><g transform="translate(31 196) scale(0.8333333333333334)"><path d="M3 6h7l2 3h9v11H3z" fill="none" stroke="#73e2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="212" fill="#ecf2f5" font-size="14" font-weight="600">Профили</text><g transform="translate(31 248) scale(0.8333333333333334)"><path d="M4 6h16M4 12h16M4 18h16M9 3v6M16 9v6M8 15v6" fill="none" stroke="#a1b1ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="264" fill="#a1b1ba" font-size="14" font-weight="400">Стратегии</text><path d="M24 620H184" stroke="#293943"/><text x="26" y="650" fill="#a1b1ba" font-size="10" font-weight="400">Изменения могут требовать</text><text x="26" y="668" fill="#a1b1ba" font-size="10" font-weight="400">системного подтверждения.</text><text x="240" y="62" fill="#ecf2f5" font-size="26" font-weight="600">Профили</text><text x="240" y="88" fill="#a1b1ba" font-size="12" font-weight="400">Сохранённые настройки для разных подключений</text><rect x="892" y="40" width="116" height="40" rx="9" fill="#1d2b34" stroke="#293943"/><text x="908" y="65" fill="#ecf2f5" font-size="13" font-weight="600">Обновить</text><path d="M240 116H1008" stroke="#293943"/><path d="M240 674H1008" stroke="#293943"/><circle cx="247" cy="696" r="3" fill="#73e2c2"/><text x="259" y="700" fill="#a1b1ba" font-size="11" font-weight="400">Настройки прочитаны</text><text x="843" y="700" fill="#a1b1ba" font-size="11" font-weight="400">Сервис работает</text><rect x="0" y="0" width="1040" height="720" rx="0" fill="#080c10" fill-opacity="0.76" stroke="none"/><rect x="292" y="204" width="456" height="308" rx="16" fill="#18232c" stroke="#384b58"/><text x="320" y="249" fill="#ecf2f5" font-size="21" font-weight="600">Сохранить настройку</text><text x="320" y="278" fill="#a1b1ba" font-size="12" font-weight="400">Профиль сохранит текущие параметры подключения.</text><text x="320" y="320" fill="#ecf2f5" font-size="12" font-weight="500">Имя профиля</text><rect x="320" y="332" width="400" height="44" rx="9" fill="#10191f" stroke="#73e2c2"/><text x="336" y="359" fill="#ecf2f5" font-size="14" font-weight="400">home</text><text x="320" y="402" fill="#a1b1ba" font-size="11" font-weight="400">1–48 символов: A–Z, a–z, 0–9, _ и -.</text><text x="320" y="423" fill="#a1b1ba" font-size="11" font-weight="400">Первый символ — буква или цифра.</text><rect x="458" y="450" width="104" height="40" rx="9" fill="#1d2b34" stroke="#293943"/><text x="474" y="475" fill="#ecf2f5" font-size="13" font-weight="600">Отмена</text><rect x="574" y="450" width="146" height="40" rx="9" fill="#73e2c2" stroke="none"/><text x="590" y="475" fill="#0d1318" font-size="13" font-weight="600">Сохранить</text></svg>