name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src
      - name: Check shell scripts
        run: bash -n scripts/install.sh scripts/uninstall.sh scripts/setup.sh
      - name: Validate fresh-install plan
        run: bash scripts/setup.sh --dry-run --backend-root "$RUNNER_TEMP/fresh-zapret"
      - name: Test staged installation and removal
        run: |
          DESTDIR="$RUNNER_TEMP/zapret-stage" bash scripts/install.sh
          test -x "$RUNNER_TEMP/zapret-stage/usr/local/bin/zapret-console"
          DESTDIR="$RUNNER_TEMP/zapret-stage" bash scripts/uninstall.sh
          test ! -e "$RUNNER_TEMP/zapret-stage/usr/local/bin/zapret-console"
          test -f "$RUNNER_TEMP/zapret-stage/etc/zapret-console/settings.json"
