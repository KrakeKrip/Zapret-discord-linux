name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python scripts/check-tests.py
      - name: Compile Python
        run: python -m compileall -q src scripts/install.py packaging/launcher.py
      - name: Check shell scripts
        run: bash -n scripts/install.sh scripts/uninstall.sh scripts/setup.sh
      - name: Validate fresh-install plan
        run: bash scripts/setup.sh --dry-run --backend-root "$RUNNER_TEMP/fresh-zapret"
      - name: Test staged installation and removal
        run: |
          DESTDIR="$RUNNER_TEMP/zapret-stage" bash scripts/install.sh
          test -x "$RUNNER_TEMP/zapret-stage/usr/local/bin/zapret-console"
          DESTDIR="$RUNNER_TEMP/zapret-stage" bash scripts/uninstall.sh
          test ! -e "$RUNNER_TEMP/zapret-stage/usr/local/bin/zapret-console"
          test -f "$RUNNER_TEMP/zapret-stage/etc/zapret-console/settings.json"

  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare native Qt dependencies and staging venv
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv desktop-file-utils libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install graphical frontend
        run: python -m pip install '.[gui]' build setuptools wheel
      - name: GUI and terminal menu regression tests
        run: python scripts/check-tests.py
      - name: Install real UI dependencies in staging
        run: |
          DESTDIR="$RUNNER_TEMP/zapret-runtime" bash scripts/install.sh --with-deps
          "$RUNNER_TEMP/zapret-runtime/usr/local/bin/zapret-console" --help
          release="$(readlink -f "$RUNNER_TEMP/zapret-runtime/usr/local/lib/zapret-console/current")"
          "$release/venv/bin/python" -I -c 'from PySide6.QtQml import QQmlApplicationEngine'
          desktop-file-validate "$RUNNER_TEMP/zapret-runtime/usr/local/share/applications/"*.desktop
          DESTDIR="$RUNNER_TEMP/zapret-runtime" bash scripts/uninstall.sh
